name: go-test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JDTLS_VERSION: "1.57.0"
      # jdtls 1.57.0 indexes the Java fixture in <1s on Java 21. Keep a 2m
      # ceiling as cold-runner safety margin; warm runs return instantly.
      SERENA_TEST_LS_TIMEOUT: "2m"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Java (for jdtls)
        # jdtls 1.57.0 requires Java 21+. Running on 17 produces the symptom
        # "jdtls requires at least Java 21" from the launcher wrapper, which
        # manifests as instant `internal: acquire session` errors at the MCP
        # layer because every spawned worker dies in <100ms before LSP init.
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install jdtls
        run: |
          set -euo pipefail
          JDTLS_HOME="$HOME/.local/share/jdtls"
          mkdir -p "$JDTLS_HOME" "$HOME/.local/bin"

          # Eclipse publishes the tarball name (with timestamp) in latest.txt
          TARBALL=$(curl -fsSL "https://download.eclipse.org/jdtls/milestones/${JDTLS_VERSION}/latest.txt")
          curl -fsSL "https://download.eclipse.org/jdtls/milestones/${JDTLS_VERSION}/${TARBALL}" \
            | tar -xz -C "$JDTLS_HOME"

          # Self-contained wrapper script — invoked as `jdtls -data <dir>` by lspool
          cat > "$HOME/.local/bin/jdtls" <<'WRAPPER'
          #!/usr/bin/env bash
          set -e
          JDTLS_HOME="$HOME/.local/share/jdtls"
          JAVA_BIN="${JAVA_HOME:-/usr}/bin/java"
          LAUNCHER=$(echo "$JDTLS_HOME"/plugins/org.eclipse.equinox.launcher_*.jar)
          case "$(uname -s)" in
            Darwin) CONFIG="$JDTLS_HOME/config_mac" ;;
            *)      CONFIG="$JDTLS_HOME/config_linux" ;;
          esac
          if [[ "${1:-}" == "--help" ]]; then
            echo "jdtls wrapper for Eclipse JDT.LS (linux/mac)"
            exit 0
          fi
          exec "$JAVA_BIN" \
            -Declipse.application=org.eclipse.jdt.ls.core.id1 \
            -Dosgi.bundles.defaultStartLevel=4 \
            -Declipse.product=org.eclipse.jdt.ls.core.product \
            -Dlog.level=ALL \
            -Xmx1G \
            --add-modules=ALL-SYSTEM \
            --add-opens java.base/java.util=ALL-UNNAMED \
            --add-opens java.base/java.lang=ALL-UNNAMED \
            -jar "$LAUNCHER" \
            -configuration "$CONFIG" \
            "$@"
          WRAPPER
          chmod +x "$HOME/.local/bin/jdtls"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/jdtls" --help

      - name: Cache warm jdtls workspace
        uses: actions/cache@v3
        with:
          path: ~/.cache/serena-test/jdtls
          key: jdtls-warm-${{ runner.os }}-${{ hashFiles('testdata/fixtures/java/**') }}-jdtls-${{ env.JDTLS_VERSION }}
          restore-keys: |
            jdtls-warm-${{ runner.os }}-

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1
