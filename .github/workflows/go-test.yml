name: go-test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JDTLS_VERSION: "1.57.0"
      # jdtls 1.57.0 indexes the Java fixture in <1s on Java 21. Keep a 2m
      # ceiling as cold-runner safety margin; warm runs return instantly.
      HELIX_TEST_LS_TIMEOUT: "2m"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Java (for jdtls)
        # jdtls 1.57.0 requires Java 21+. Running on 17 produces the symptom
        # "jdtls requires at least Java 21" from the launcher wrapper, which
        # manifests as instant `internal: acquire session` errors at the MCP
        # layer because every spawned worker dies in <100ms before LSP init.
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install jdtls
        run: |
          set -euo pipefail
          JDTLS_HOME="$HOME/.local/share/jdtls"
          mkdir -p "$JDTLS_HOME" "$HOME/.local/bin"

          # Eclipse publishes the tarball name (with timestamp) in latest.txt
          TARBALL=$(curl -fsSL "https://download.eclipse.org/jdtls/milestones/${JDTLS_VERSION}/latest.txt")
          curl -fsSL "https://download.eclipse.org/jdtls/milestones/${JDTLS_VERSION}/${TARBALL}" \
            | tar -xz -C "$JDTLS_HOME"

          # Self-contained wrapper script — invoked as `jdtls -data <dir>` by lspool
          cat > "$HOME/.local/bin/jdtls" <<'WRAPPER'
          #!/usr/bin/env bash
          set -e
          JDTLS_HOME="$HOME/.local/share/jdtls"
          JAVA_BIN="${JAVA_HOME:-/usr}/bin/java"
          LAUNCHER=$(echo "$JDTLS_HOME"/plugins/org.eclipse.equinox.launcher_*.jar)
          case "$(uname -s)" in
            Darwin) CONFIG="$JDTLS_HOME/config_mac" ;;
            *)      CONFIG="$JDTLS_HOME/config_linux" ;;
          esac
          if [[ "${1:-}" == "--help" ]]; then
            echo "jdtls wrapper for Eclipse JDT.LS (linux/mac)"
            exit 0
          fi
          exec "$JAVA_BIN" \
            -Declipse.application=org.eclipse.jdt.ls.core.id1 \
            -Dosgi.bundles.defaultStartLevel=4 \
            -Declipse.product=org.eclipse.jdt.ls.core.product \
            -Dlog.level=ALL \
            -Xmx1G \
            --add-modules=ALL-SYSTEM \
            --add-opens java.base/java.util=ALL-UNNAMED \
            --add-opens java.base/java.lang=ALL-UNNAMED \
            -jar "$LAUNCHER" \
            -configuration "$CONFIG" \
            "$@"
          WRAPPER
          chmod +x "$HOME/.local/bin/jdtls"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/jdtls" --help

      - name: Cache warm jdtls workspace
        uses: actions/cache@v3
        with:
          path: ~/.cache/helix-test/jdtls
          key: jdtls-warm-${{ runner.os }}-${{ hashFiles('testdata/fixtures/java/**') }}-jdtls-${{ env.JDTLS_VERSION }}
          restore-keys: |
            jdtls-warm-${{ runner.os }}-

      - name: go vet (incl. 4 project analyzers via make vet)
        # Runs go vet ./... plus the 4 project-local analyzers:
        # vet-noduckdb, vet-nokernel2semantic, vet-nosemantic2kernel,
        # vet-compact-uses-store. Resolves F-03 from v1.10-MILESTONE-AUDIT.
        run: make vet

      - name: go test
        run: go test ./... -count=1

      - name: helix-cligen drift gate (VERB-02)
        # HARD-FAIL if internal/cli/verbs_gen.go is stale relative to the live
        # tool registry (an *Args edit without regen). Mirrors the docgen
        # discipline. Regenerate with: go run ./cmd/helix-cligen
        run: go run ./cmd/helix-cligen --check

      - name: docgen drift gate (DOCS-02)
        # HARD-FAIL if README.md tool table is stale relative to the live
        # tool registry (a tool registration without `make docs`). Closes the
        # v1.12 docgen-drift hole. Regenerate with: go run ./cmd/docgen
        run: go run ./cmd/docgen --check

      - name: eval-quick (harness validation)
        # eval-quick runs the in-process scripted-agent harness validation (<30s wall-time).
        # This is the ONLY eval target allowed in PR-gating CI (project rule: benchmarks local-only).
        # 'make eval' (full out-of-process matrix) is EXPLICITLY excluded from all CI workflows.
        run: make eval-quick
        timeout-minutes: 2

      - name: eval-attestation-check (warn-only)
        # Hygiene reminder per project rule "benchmarks local-only" — NEVER fails the build.
        # Prints a stderr WARNING if eval/EVAL.md attestation is >180 days stale.
        continue-on-error: true
        run: make eval-attestation-check

      - name: F-06 smoke — upgrade daemon-detect short-circuit
        # Warn-only smoke per project rule "benchmarks local-only" / warn-only
        # CI hygiene (continue-on-error: true). Builds helix, exercises the
        # daemon-detect short-circuit on `helix upgrade --check` by setting
        # HELIX_RUNNING_AS_DAEMON=1 in the env (the signal internal/upgrade/
        # daemon_detect.go inspects), and asserts the exact short-circuit
        # message from internal/upgrade/upgrade.go:119 appears on stdout.
        # Closes F-06 from .planning/v1.10-MILESTONE-AUDIT.md.
        continue-on-error: true
        run: |
          set -eo pipefail
          go build -o /tmp/helix ./cmd/helix
          OUTPUT=$(HELIX_RUNNING_AS_DAEMON=1 /tmp/helix upgrade --check 2>&1 || true)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "helix is running as a daemon child process" \
            || (echo "F-06 smoke: daemon-detect short-circuit DID NOT fire" && exit 1)
          echo "F-06 smoke: daemon-detect short-circuit OK"

      - name: forbid judge in CI
        # Grep gate: fail the build if tool_behavior_judge.json is referenced
        # in any workflow file. The LLM judge must NEVER gate merges (EVAL-07).
        # This step excludes itself from the search via --exclude.
        run: |
          if grep -r "tool_behavior_judge" .github/workflows/ --exclude="go-test.yml" ; then
            echo "ERROR: tool_behavior_judge.json must NEVER be referenced in CI workflows (EVAL-07)."
            echo "The LLM judge is INFORMATIONAL only. Revert the workflow change that added this reference."
            exit 1
          fi
          echo "OK: no tool_behavior_judge reference found in CI workflows (excluding this file's self-reference)"
