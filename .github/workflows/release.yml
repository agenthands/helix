name: release

on:
  push:
    tags:
      - 'v*'
  # D-16: workflow_dispatch enables snapshot rehearsal of the full split-runner
  # pipeline against a draft branch before cutting a real tag. Wave 5 uses this
  # to capture the FIRST-CI-REPRO-LOG. The macOS job is gated to fire ONLY on
  # tag-push or workflow_dispatch (not arbitrary PRs) per D-16 cost-bounding.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to dispatch against (defaults to current ref)'
        required: false
        type: string

# WR-01: deny all workflow-level permissions by default; grant the minimum
# required permissions per-job. Future jobs added to this workflow do NOT
# inherit id-token: write (which would let them mint Fulcio certs as the
# release identity).
permissions: {}

jobs:
  release-linux:
    name: build linux + windows archives (zig cc cross-compile)
    # WR-04: pin to ubuntu-22.04 (LTS) — same posture as the original single-runner job.
    runs-on: ubuntu-22.04
    permissions:
      # WR-01: id-token NOT needed on this job — cosign signing happens in release-merge.
      # contents NOT needed here — release publishing also happens in release-merge.
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0   # required: goreleaser changelog needs full git history

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: '1.25.x'
          cache: true

      - name: Install cross toolchains for linux/arm64 + windows/amd64 (DEF-59.1-LINUX-ZIG-LIBSTDCXX option 2 — final)
        # D-20 amended: zig cc is removed entirely from this job because zig
        # bundles libc++ exclusively, and `libduckdb_static.a` (from
        # duckdb-go-bindings) is built against libstdc++ on every shipped
        # platform (linux + windows). Empirically disproven attempts:
        #   - v1.10.1 (zig+musl, run 25365003032) — ld.lld libstdc++ symbol fail
        #   - v1.10.2 (zig+gnu, run 25365967264) — ld.lld libstdc++ symbol fail
        #   - v1.10.3 (host gcc linux + zig windows, run 25366745208) — linux
        #     PASSED, windows lld-link libstdc++ symbol fail
        # Resolution: every helix-non-darwin target uses a real gcc/g++ toolchain
        # that ships libstdc++:
        #   - linux/amd64   → ubuntu-22.04 host gcc / g++ (no install needed)
        #   - linux/arm64   → gcc-aarch64-linux-gnu / g++-aarch64-linux-gnu (apt)
        #   - windows/amd64 → gcc-mingw-w64-x86-64 (apt; provides
        #                     x86_64-w64-mingw32-gcc + …-g++ with libstdc++)
        #   - windows/arm64 → EXCLUDED via .goreleaser.yaml `ignore` list
        #                     (duckdb-go-bindings does not ship a windows-arm64
        #                     prebuilt static lib — see DEF-59-WIN-ARM64-RESTORE)
        # Windows static linking required: -static-libgcc / -static-libstdc++
        # / -lpthread to produce a self-contained .exe (no MSYS2 DLL deps on
        # end-user machines).
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # mingw-w64-x86-64-posix uses winpthread (POSIX threads) instead of
          # win32 threads — required because duckdb-go-bindings'
          # libparquet_extension.a calls pthread_mutex_lock/unlock/init/destroy.
          # The default `gcc-mingw-w64-x86-64` (win32 thread model) does NOT
          # expose those symbols. Empirically: v1.10.4 (run 25367440847) failed
          # with `undefined reference to pthread_mutex_*`; this fixes that.
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-mingw-w64-x86-64-posix \
            g++-mingw-w64-x86-64-posix
          # Switch the system mingw-w64 alternatives to the posix-threads variant
          # so `x86_64-w64-mingw32-gcc` and `x86_64-w64-mingw32-g++` resolve to
          # the posix binaries (CGO invokes the unsuffixed name via $CC).
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          gcc --version | head -1
          aarch64-linux-gnu-gcc --version | head -1
          x86_64-w64-mingw32-gcc --version | head -1
          x86_64-w64-mingw32-g++ --version | head -1

      - name: Reproducibility gate -- snapshot Pass-1 (helix-non-darwin)
        # D-20 / FALLBACK-B-MULTI-BUILD-ID: --id helix-non-darwin filters the build to
        # the linux/{amd64,arm64} + windows/{amd64,arm64} entries declared in
        # .goreleaser.yaml. goreleaser writes binaries to ./dist/<id>_<os>_<arch>/helix
        # (the `dist:` root is the goreleaser default; --output is a per-binary path
        # template, not a directory selector — we move the dist tree post-build to
        # isolate Pass-1 from Pass-2 outputs; Wave 5 hot-fix).
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29  # v7.0.0
        with:
          distribution: goreleaser
          version: 'v2.15.4'   # WR-07: pin to exact version, not `~> v2`
          args: build --snapshot --clean --id helix-non-darwin

      - name: Stash Pass-1 dist as dist-pass-1 (helix-non-darwin)
        run: |
          set -euo pipefail
          # Wave 5 hot-fix: goreleaser build --output is a per-binary path template,
          # NOT a dist-root override. Move the freshly-built dist/ aside so Pass-2's
          # `goreleaser build --clean` (which wipes dist/) doesn't blow it away.
          rm -rf dist-pass-1
          mv dist dist-pass-1

      - name: Capture Pass-1 sha256s (helix-non-darwin)
        run: |
          set -euo pipefail
          # D-17: per-target within-runner Pass-1≡Pass-2 reproducibility. Capture
          # sha256 of every binary under dist-pass-1/helix-non-darwin_*/, sorted for
          # deterministic comparison. 4 binaries expected (linux/{amd64,arm64} +
          # windows/{amd64,arm64}); on linux+windows the binary is `helix` (no .exe
          # suffix is stripped by goreleaser at the build pipe — only the archive
          # pipe adds .exe; here we hash the raw binaries).
          (cd dist-pass-1 && find . -type f -name 'helix*' -print0 | sort -z | xargs -0 sha256sum) > /tmp/pass1-linux.sha256
          echo "Pass-1 (helix-non-darwin) artifacts:"
          cat /tmp/pass1-linux.sha256

      - name: Reproducibility gate -- snapshot Pass-2 (helix-non-darwin)
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29  # v7.0.0
        with:
          distribution: goreleaser
          version: 'v2.15.4'   # WR-07: must match Pass-1 pin exactly
          args: build --snapshot --clean --id helix-non-darwin

      - name: Stash Pass-2 dist as dist-pass-2 (helix-non-darwin)
        run: |
          set -euo pipefail
          rm -rf dist-pass-2
          mv dist dist-pass-2

      - name: Diff Pass-1 vs Pass-2 sha256s (helix-non-darwin) -- fail if non-reproducible
        run: |
          set -euo pipefail
          # D-17: per-target byte-equality on the 4 helix-non-darwin binaries.
          # Cross-runner equality with the macos runner is NOT asserted (see
          # release-darwin job's analogous step + D-17 invariant).
          (cd dist-pass-2 && find . -type f -name 'helix*' -print0 | sort -z | xargs -0 sha256sum) \
            | sed 's| dist-pass-2/| dist-pass-1/|' > /tmp/pass2-linux.sha256
          if diff -u /tmp/pass1-linux.sha256 /tmp/pass2-linux.sha256; then
            echo "Reproducibility gate PASS (helix-non-darwin) -- proceeding to artifact upload"
            exit 0
          fi

          # WR-07 forensic dump (per-runner; fork of the original release.yml lines 88-119
          # logic, scoped to helix-non-darwin binaries on the linux runner).
          echo "::error::helix-non-darwin binaries are not byte-identical between Pass-1 and Pass-2 -- refusing to upload"
          echo
          echo "=== Forensic dump (WR-07, runner=linux, scope=helix-non-darwin) ==="
          DIVERGENT=$(diff /tmp/pass1-linux.sha256 /tmp/pass2-linux.sha256 | grep '^[<>]' | head -1 | awk '{print $NF}' | sed 's|^./||;s|^dist-pass-1/||')
          if [ -n "$DIVERGENT" ]; then
            echo "Divergent binary: $DIVERGENT"
            BIN1="dist-pass-1/$DIVERGENT"
            BIN2="dist-pass-2/$DIVERGENT"
            echo
            echo "=== Per-file sha256 ==="
            sha256sum "$BIN1" "$BIN2" || true
            echo
            echo "=== Binary sizes (bytes) ==="
            ls -l "$BIN1" "$BIN2" || true
            echo
            echo "=== Go buildinfo diff (go version -m) ==="
            go version -m "$BIN1" > /tmp/bi1 || true
            go version -m "$BIN2" > /tmp/bi2 || true
            diff -u /tmp/bi1 /tmp/bi2 || true
            echo
            echo "=== First 512 bytes (hex) of each binary ==="
            xxd "$BIN1" | head -32
            echo "---"
            xxd "$BIN2" | head -32
          fi
          exit 1

      - name: Promote Pass-2 to dist/ for artifact upload
        run: |
          set -euo pipefail
          # Pass-1≡Pass-2 has just passed; either tree contains the canonical
          # binaries. Re-use Pass-2 (most recent build) as the upload payload.
          # IN-03 hygiene: clean up Pass-1 to keep the workspace tidy.
          rm -rf dist-pass-1
          rm -rf dist
          mv dist-pass-2 dist

      - name: Upload helix-non-darwin partial dist
        # WR-04: SHA-pinned actions/upload-artifact (verified via git ls-remote 2026-05-04:
        # refs/tags/v4.4.3 → b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882).
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: dist-partial-linux
          path: dist/
          retention-days: 1
          if-no-files-found: error

  release-darwin:
    name: build darwin archives (Apple clang native, macos-14)
    # D-18: pin to macos-14 (Apple Silicon, Xcode 15.x). Do NOT use the floating
    # `macos-${LATEST}` alias — image-internal Xcode/clang version drift breaks the
    # per-runner Pass-1≡Pass-2 gate. Roll forward to a newer macos-N is an
    # intentional follow-up phase, not auto-update.
    runs-on: macos-14
    # D-16: cost gating. macos-14 runner is billed at ~10× the linux rate; PR
    # validation stays linux-only. This job fires ONLY on tag-push (real release)
    # or workflow_dispatch (Wave 5 snapshot rehearsal / first-CI-repro).
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    permissions:
      # WR-01: no id-token / contents needed on this job — cosign signing and
      # release publishing happen in release-merge.
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0   # required: goreleaser changelog needs full git history

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: '1.25.x'
          cache: true

      - name: Select Xcode 15.x (D-18)
        # D-18: pin Xcode-internal version explicitly. macos-14 image ships multiple
        # Xcodes; xcode-select chooses one. If a specific 15.x point version is
        # required for reproducibility under Apple-toolchain timestamp behavior
        # (D-10 amended), Wave 5 first-CI-repro will surface that and Wave 5 hot-fix
        # narrows this selector. The fallback warning lets the workflow surface a
        # readable failure if the path doesn't exist on a future image refresh.
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d /Applications/Xcode_15.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app
          elif [ -d /Applications/Xcode_15.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app
          else
            echo "::warning::No Xcode 15.x found at expected paths; falling back to default xcode-select"
            ls -la /Applications/ | grep -i xcode || true
          fi

      - name: Record Apple toolchain provenance (D-18)
        # D-18: per-runner forensic provenance — captures Xcode + clang versions
        # for the build provenance trail. Used by Wave 5 FIRST-CI-REPRO log
        # and by future reproducibility regression triage.
        run: |
          set -euo pipefail
          echo "=== xcodebuild -version ==="
          xcodebuild -version
          echo
          echo "=== clang --version ==="
          clang --version
          echo
          echo "=== xcode-select -p ==="
          xcode-select -p
          echo
          echo "=== sw_vers ==="
          sw_vers

      - name: Reproducibility gate -- snapshot Pass-1 (helix-darwin)
        # D-20 / FALLBACK-B-MULTI-BUILD-ID: --id helix-darwin filters to the 2
        # darwin/{amd64,arm64} entries declared in .goreleaser.yaml. NO CC override
        # — Apple clang on macos-14 is the host default per D-15.
        # Note: goreleaser build --output is a per-binary path template, not a
        # dist-root override; we mv dist aside post-build to isolate Pass-1 from
        # Pass-2 (Wave 5 hot-fix; mirrors release-linux job).
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29  # v7.0.0
        with:
          distribution: goreleaser
          version: 'v2.15.4'   # WR-07: pin to exact version, matches release-linux
          args: build --snapshot --clean --id helix-darwin

      - name: Stash Pass-1 dist as dist-pass-1 (helix-darwin)
        run: |
          set -euo pipefail
          rm -rf dist-pass-1
          mv dist dist-pass-1

      - name: Capture Pass-1 sha256s (helix-darwin)
        run: |
          set -euo pipefail
          # D-17: per-target within-runner Pass-1≡Pass-2 reproducibility for the
          # 2 helix-darwin binaries. Cross-runner equality with the linux runner
          # is NOT asserted (D-17 invariant — different machines, different SDKs,
          # different clang versions; that comparison is not meaningful).
          (cd dist-pass-1 && find . -type f -name 'helix*' -print0 | sort -z | xargs -0 shasum -a 256) > /tmp/pass1-darwin.sha256
          echo "Pass-1 (helix-darwin) artifacts:"
          cat /tmp/pass1-darwin.sha256

      - name: Reproducibility gate -- snapshot Pass-2 (helix-darwin)
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29  # v7.0.0
        with:
          distribution: goreleaser
          version: 'v2.15.4'   # WR-07: must match Pass-1 pin exactly
          args: build --snapshot --clean --id helix-darwin

      - name: Stash Pass-2 dist as dist-pass-2 (helix-darwin)
        run: |
          set -euo pipefail
          rm -rf dist-pass-2
          mv dist dist-pass-2

      - name: Diff Pass-1 vs Pass-2 sha256s (helix-darwin) -- fail if non-reproducible
        run: |
          set -euo pipefail
          # D-17: per-target byte-equality on the 2 helix-darwin binaries.
          # If divergence is from Apple-toolchain timestamps (codesign, LC_UUID),
          # remediation is strip/freeze the offending field per D-10 amended,
          # NOT softening the gate.
          (cd dist-pass-2 && find . -type f -name 'helix*' -print0 | sort -z | xargs -0 shasum -a 256) \
            | sed 's| dist-pass-2/| dist-pass-1/|' > /tmp/pass2-darwin.sha256
          if diff -u /tmp/pass1-darwin.sha256 /tmp/pass2-darwin.sha256; then
            echo "Reproducibility gate PASS (helix-darwin) -- proceeding to artifact upload"
            exit 0
          fi

          # WR-07 forensic dump (per-runner; runner=darwin scope=helix-darwin).
          echo "::error::helix-darwin binaries are not byte-identical between Pass-1 and Pass-2 -- refusing to upload"
          echo
          echo "=== Forensic dump (WR-07, runner=darwin, scope=helix-darwin) ==="
          echo
          echo "=== Apple toolchain provenance (re-captured for forensic trail) ==="
          xcodebuild -version || true
          clang --version || true
          echo
          DIVERGENT=$(diff /tmp/pass1-darwin.sha256 /tmp/pass2-darwin.sha256 | grep '^[<>]' | head -1 | awk '{print $NF}' | sed 's|^./||;s|^dist-pass-1/||')
          if [ -n "$DIVERGENT" ]; then
            echo "Divergent binary: $DIVERGENT"
            BIN1="dist-pass-1/$DIVERGENT"
            BIN2="dist-pass-2/$DIVERGENT"
            echo
            echo "=== Per-file sha256 ==="
            shasum -a 256 "$BIN1" "$BIN2" || true
            echo
            echo "=== Binary sizes (bytes) ==="
            ls -l "$BIN1" "$BIN2" || true
            echo
            echo "=== Mach-O LC_UUID + codesign timestamp diff (Apple-toolchain hazard per D-10 amended) ==="
            otool -l "$BIN1" 2>/dev/null | grep -A2 LC_UUID || true
            otool -l "$BIN2" 2>/dev/null | grep -A2 LC_UUID || true
            codesign -dv "$BIN1" 2>&1 | head -20 || true
            codesign -dv "$BIN2" 2>&1 | head -20 || true
            echo
            echo "=== Go buildinfo diff (go version -m) ==="
            go version -m "$BIN1" > /tmp/bi1 || true
            go version -m "$BIN2" > /tmp/bi2 || true
            diff -u /tmp/bi1 /tmp/bi2 || true
            echo
            echo "=== First 512 bytes (hex) of each binary ==="
            xxd "$BIN1" | head -32
            echo "---"
            xxd "$BIN2" | head -32
          fi
          exit 1

      - name: Promote Pass-2 to dist/ for artifact upload
        run: |
          set -euo pipefail
          rm -rf dist-pass-1
          rm -rf dist
          mv dist-pass-2 dist

      - name: Upload helix-darwin partial dist
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: dist-partial-darwin
          path: dist/
          retention-days: 1
          if-no-files-found: error

  release-merge:
    name: merge partial dists, sign, publish
    # D-15: merge step runs on the cheaper linux runner. Phase 58 cosign keyless
    # signing (D-19) runs here uniformly across all 6 archives. The
    # `helix upgrade` artifact-name shape and `.sigstore.json` bundle layout
    # are preserved from .goreleaser.yaml's `archives:` and `signs:` blocks.
    runs-on: ubuntu-22.04
    # D-15 + D-16: needs both runners. release-darwin is gated on tag-push or
    # workflow_dispatch; if it's skipped (e.g. PR), release-merge is also
    # skipped via dependency wiring + this job's matching `if:` guard.
    needs: [release-linux, release-darwin]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write   # required: create release, upload assets (real tag-push only)
      id-token: write   # Phase 58 D-02: cosign keyless OIDC (Fulcio short-lived cert)
    timeout-minutes: 30
    steps:
      - name: Checkout
        # Required for goreleaser changelog generation (--skip=build still needs git history).
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        # Required because goreleaser embeds Go runtime info during the archive
        # pipe even when --skip=build is set (changelog templating + sign).
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: '1.25.x'
          cache: true

      - name: Install cosign
        # Phase 58 D-02: keyless signing via Fulcio + Rekor. WR-08 / WR-10 already
        # captured in .goreleaser.yaml `signs:` block (--new-bundle-format,
        # public-good TSA at timestamp.sigstore.dev). D-19: this attestation runs
        # uniformly across ALL 6 archives (linux + windows + darwin); no Apple
        # Developer ID notarization (Apple notarization deferred per Wave 4).
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          cosign-release: 'v2.4.1'

      - name: Download helix-non-darwin partial dist
        # WR-04: SHA-pinned actions/download-artifact (verified via git ls-remote
        # 2026-05-04: refs/tags/v4.1.8 → fa0a91b85d4f404e444e00e005971372dc801d16).
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: dist-partial-linux
          path: dist-partial-linux/

      - name: Download helix-darwin partial dist
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: dist-partial-darwin
          path: dist-partial-darwin/

      - name: Merge partial dists into single dist/ tree
        run: |
          set -euo pipefail
          # FALLBACK-B-MULTI-BUILD-ID merge layout (per 59.1-02-SPLIT-PROBE-NOTES.md
          # line 200): goreleaser writes dist/helix-<id>_<os>_<arch>/helix[.exe] during
          # `goreleaser build`. `goreleaser release --skip=build` reads from `dist/`
          # and runs the archive + checksum + sign + publish pipes. Both partial
          # bundles are merged into a single dist/ for the release pipe.
          rm -rf dist
          mkdir -p dist
          # Partial bundles: copy the per-build subdirectories into dist/ preserving
          # goreleaser's expected layout. Use cp -r (NOT mv) to keep download artifacts
          # available for forensic inspection if the merge step fails.
          if [ -d dist-partial-linux ]; then
            cp -r dist-partial-linux/* dist/ 2>/dev/null || true
          fi
          if [ -d dist-partial-darwin ]; then
            cp -r dist-partial-darwin/* dist/ 2>/dev/null || true
          fi
          echo "=== Merged dist/ layout (input to goreleaser release --skip=build) ==="
          find dist -maxdepth 3 -type f -name 'helix*' | sort
          echo
          echo "=== Per-build-id subdirs ==="
          ls -la dist/ | grep -E '^d' || true
          # Sanity: expect 6 binaries total (4 from linux runner + 2 from darwin runner).
          BINARY_COUNT=$(find dist -type f -name 'helix*' | wc -l | tr -d ' ')
          echo "Total binaries in merged dist/: ${BINARY_COUNT}"
          if [ "${BINARY_COUNT}" -lt 6 ]; then
            echo "::warning::Expected 6 binaries in merged dist/, found ${BINARY_COUNT}. release --skip=build may fail."
          fi

      - name: Real release (tag-push) -- archive + checksum + sign + publish
        # Real (non-snapshot) tag-push merge: --skip=build because both runners
        # already produced binaries. archive + checksum + cosign sign + GitHub
        # release publishing all run here uniformly across 6 archives (D-19).
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29  # v7.0.0
        with:
          distribution: goreleaser
          version: 'v2.15.4'   # WR-07: matches release-linux + release-darwin pin
          args: release --clean --skip=build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snapshot rehearsal (workflow_dispatch) -- archive + checksum only (no sign, no publish)
        # workflow_dispatch path is the snapshot rehearsal Wave 5 uses to capture
        # FIRST-CI-REPRO-LOG without consuming a real tag. --skip=build,sign means
        # archive + checksum run; cosign sign + GitHub release publish are skipped.
        # Wave 5 verifies the 6 archives appear with correct names and the cosign
        # bundle layout would have been emitted (from .goreleaser.yaml signs: block
        # being unchanged from the verified Phase 58 shape).
        if: github.event_name == 'workflow_dispatch'
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29  # v7.0.0
        with:
          distribution: goreleaser
          version: 'v2.15.4'
          args: release --snapshot --clean --skip=build,sign

      - name: Upload merged dist as workflow artifact (snapshot rehearsal forensic trail)
        # Both real and snapshot paths upload the final dist/ for Wave 5 to inspect.
        # On real tag-push, dist/ contains signed archives + .sigstore.json bundles
        # + checksums.txt (these are also published on the GitHub Release; the
        # workflow artifact is a short-retention duplicate for triage).
        # On workflow_dispatch, dist/ contains unsigned archives + checksums.txt
        # (no .sigstore.json — sign was skipped). Wave 5 downloads this artifact
        # and verifies layout + per-runner Pass-1≡Pass-2 evidence end-to-end.
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: dist-merged-${{ github.run_id }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
