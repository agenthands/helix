name: release

on:
  push:
    tags:
      - 'v*'

# WR-01: deny all workflow-level permissions by default; grant the minimum
# required permissions per-job. Future jobs added to this workflow do NOT
# inherit id-token: write (which would let them mint Fulcio certs as the
# release identity).
permissions: {}

jobs:
  release:
    name: goreleaser
    # WR-04: pin to ubuntu-22.04 (LTS) for a stable runner image. The runtime
    # `uname -m` checks below remain as defense-in-depth backstops for future
    # runner image changes.
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # required: create release, upload assets
      id-token: write   # Phase 58 D-02: cosign keyless OIDC token (Fulcio short-lived cert)
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0   # required: goreleaser changelog needs full git history

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: '1.25.x'
          cache: true

      - name: Install cosign  # Phase 58 D-02: keyless signing via Fulcio + Rekor.
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          cosign-release: 'v2.4.1'

      - name: Reproducibility gate -- snapshot pass 1
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29  # v7.0.0
        with:
          distribution: goreleaser
          # WR-07: pin to an exact goreleaser version (not `~> v2`) so
          # reproducibility-gate behavior cannot drift mid-flight when a
          # new minor is published. Bump deliberately, in lockstep with
          # local toolchain validation.
          version: 'v2.15.4'
          args: release --snapshot --clean --skip=sign

      - name: Capture pass 1 sha256s
        run: |
          set -euo pipefail
          mv dist dist-pass-1
          # WR-03: include checksums.txt alongside *.tar.gz so non-determinism
          # in the order of entries (parallel build matrix → race in append
          # order) is also caught by the repro gate.
          (cd dist-pass-1 && find . \( -name '*.tar.gz' -o -name 'checksums.txt' \) -print0 | sort -z | xargs -0 sha256sum) > /tmp/pass1.sha256
          echo "Pass 1 artifacts:"
          cat /tmp/pass1.sha256

      - name: Reproducibility gate -- snapshot pass 2
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29  # v7.0.0
        with:
          distribution: goreleaser
          version: 'v2.15.4'   # WR-07: must match Pass-1 pin exactly.
          args: release --snapshot --clean --skip=sign

      - name: Diff sha256s -- fail if non-reproducible
        run: |
          set -euo pipefail
          # WR-03: same find-glob as the pass-1 capture; keep these two in
          # lockstep or the diff gate becomes asymmetric (false-pass).
          (cd dist && find . \( -name '*.tar.gz' -o -name 'checksums.txt' \) -print0 | sort -z | xargs -0 sha256sum) \
            | sed 's| dist/| dist-pass-1/|' > /tmp/pass2.sha256
          if diff -u /tmp/pass1.sha256 /tmp/pass2.sha256; then
            echo "Reproducibility gate PASS -- proceeding to real release"
            exit 0
          fi

          # WR-07: gate failed -- emit forensic dump so the failure is
          # self-diagnosing. Pick the first divergent .tar.gz, extract
          # both passes side-by-side, diff per-file hashes + tar entry
          # metadata. Without this dump every failure requires another
          # round-trip to add logging.
          echo "::error::artifacts are not byte-identical between two snapshot runs -- refusing to publish"
          echo
          echo "=== Forensic dump (WR-07) ==="
          DIVERGENT=$(diff /tmp/pass1.sha256 /tmp/pass2.sha256 | grep '^[<>]' | head -1 | awk '{print $NF}' | sed 's|^./||;s|^dist-pass-1/||')
          if [ -n "$DIVERGENT" ] && [ "${DIVERGENT##*.}" = "gz" ]; then
            echo "Divergent archive: $DIVERGENT"
            mkdir -p /tmp/extract-1 /tmp/extract-2
            tar -xzf "dist-pass-1/$DIVERGENT" -C /tmp/extract-1
            tar -xzf "dist/$DIVERGENT"        -C /tmp/extract-2
            echo
            echo "=== Per-file sha256 (Pass-1 vs Pass-2) ==="
            (cd /tmp/extract-1 && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/c1
            (cd /tmp/extract-2 && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/c2
            diff -u /tmp/c1 /tmp/c2 || true
            echo
            echo "=== Tar entry metadata diff (mtime/uid/gid/mode/order) ==="
            tar -tvf "dist-pass-1/$DIVERGENT" | sort > /tmp/t1
            tar -tvf "dist/$DIVERGENT"        | sort > /tmp/t2
            diff -u /tmp/t1 /tmp/t2 || true
            echo
            echo "=== Gzip header bytes (mtime is offset 4..7; OS is offset 9) ==="
            xxd "dist-pass-1/$DIVERGENT" | head -1
            xxd "dist/$DIVERGENT"        | head -1
            echo
            echo "=== Go buildinfo (binary inside archive) ==="
            BIN=$(find /tmp/extract-1 -type f -name 'helix*' ! -name '*.exe' | head -1)
            BIN2=$(find /tmp/extract-2 -type f -name 'helix*' ! -name '*.exe' | head -1)
            if [ -n "$BIN" ] && [ -n "$BIN2" ]; then
              go version -m "$BIN"  > /tmp/bi1 || true
              go version -m "$BIN2" > /tmp/bi2 || true
              diff -u /tmp/bi1 /tmp/bi2 || true
            fi
          fi
          exit 1

      - name: Clean dist-pass-1 after diff gate
        run: |
          set -euo pipefail
          # The reproducibility gate kept dist-pass-1 around for the diff; remove
          # it before the real release pass so workspace caches stay tidy (IN-03).
          rm -rf dist-pass-1

      - name: Real release (sign + publish)
        # Phase 58 D-02: cosign keyless. Signing key material is the short-lived
        # Fulcio cert minted from the workflow's id-token; no long-lived secrets.
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29  # v7.0.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
