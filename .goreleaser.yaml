# Source of truth: goreleaser v2 schema. Generated for Phase 51 (PKG-01).
# Locked decisions: Phase 51 D-03/D-03a (reproducibility), D-04 (INSTALL match),
# D-06 (tag-triggered + auto pre-release), D-07 (auto-generated notes from git log).
# Phase 58 D-02/D-03: cosign keyless signing (replaces the prior signer at v1.10.0; hard cut, no coexistence).
version: 2

project_name: helix

# Phase 59.1 D-15 split-runner pipeline implemented via the goreleaser OSS
# multi-build-entry pattern (Fallback B per
# .planning/phases/.../59.1-02-SPLIT-PROBE-NOTES.md — split/merge is
# GoReleaser Pro only at v2.15.4 and Helix is on OSS). Each runner invokes
# `goreleaser build --id <runner-id> --snapshot --clean`; the merge job runs
# `goreleaser release --skip=build` to assemble archives + checksums +
# signatures from the pre-built binaries uploaded by both runners.
builds:
  - id: helix-non-darwin
    main: ./cmd/helix
    binary: helix
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # DEF-59-WIN-ARM64-RESTORE: duckdb-go-bindings does not ship a
    # windows-arm64 prebuilt static lib (only linux-{amd64,arm64},
    # windows-amd64, darwin-{amd64,arm64}). Excluded permanently until
    # upstream ships it.
    #
    # DEF-59.1-WINDOWS-CGO-MINGW (NEW, 2026-05-05): windows/amd64 is
    # also excluded for Phase 59.1. Empirical evidence (5 CI runs:
    # v1.10.1..v1.10.5):
    #   - zig+musl  → libstdc++ ABI mismatch (zig ships libc++)
    #   - zig+gnu   → same (gnu vs musl is libc, not libcxx)
    #   - mingw32+win32 threads → pthread_mutex_* missing
    #   - mingw32+posix threads → libstdc++ version drift
    #     (`std::__throw_bad_array_new_length`, `__cxa_call_terminate`,
    #     `_M_addref`/`_M_release`, `__cxx11::basic_string::reserve`,
    #     `basic_streambuf::seekpos` undefined; UCRT-vs-msvcrt also
    #     in scope: `__imp___timezone`, `__imp___tzname`,
    #     `__stdio_common_v(s)nprintf_s`)
    # The duckdb-go-bindings windows-amd64 prebuilt static lib appears
    # to be MSVC- or newer-libstdc++-built and is not link-compatible
    # with Ubuntu apt's `gcc-mingw-w64-x86-64-posix` (gcc 10 era
    # libstdc++). Resolution paths for a future phase:
    #   - llvm-mingw (newer libstdc++/libc++ + UCRT)
    #   - clang-cl on a windows runner (real MSVC ABI)
    #   - build duckdb from source under matching toolchain
    # Phase 59.1 ships the 4-archive linux+darwin matrix; windows is
    # tracked under a follow-up phase, NOT inline in 59.1.
    ignore:
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: amd64
    env:
      - CGO_ENABLED=1
      - GOFLAGS=-mod=readonly
      # D-20 amended (DEF-59.1-LINUX-ZIG-LIBSTDCXX option 2):
      #   linux targets use HOST gcc + apt-installed cross toolchain because
      #   `libduckdb_static.a` (duckdb-go-bindings) is built against
      #   libstdc++ on glibc, and zig cc bundles libc++ exclusively at every
      #   `-linux-*` triple (musl AND gnu both fail — empirically verified
      #   in v1.10.1 run 25365003032 + v1.10.2 run 25365967264).
      #     - linux/amd64: host gcc (no CC override; ubuntu-22.04 default
      #       gcc is libstdc++/glibc — matches duckdb static lib ABI).
      #     - linux/arm64: gcc-aarch64-linux-gnu cross-toolchain (apt;
      #       installed in release-linux job before goreleaser invocation).
      #   windows targets keep zig cc — zig's mingw bundle ships libstdc++
      #   for windows-gnu, so the libcxx mismatch does not apply on the
      #   windows side.
      #   darwin entries live in the helix-darwin build entry below and get
      #   NO CC override (Apple clang on macos-14 is the host default per D-15).
      - 'CC={{- if and (eq .Os "linux") (eq .Arch "amd64") -}}gcc{{- else if and (eq .Os "linux") (eq .Arch "arm64") -}}aarch64-linux-gnu-gcc{{- else if and (eq .Os "windows") (eq .Arch "amd64") -}}x86_64-w64-mingw32-gcc{{- end -}}'
      - 'CXX={{- if and (eq .Os "linux") (eq .Arch "amd64") -}}g++{{- else if and (eq .Os "linux") (eq .Arch "arm64") -}}aarch64-linux-gnu-g++{{- else if and (eq .Os "windows") (eq .Arch "amd64") -}}x86_64-w64-mingw32-g++{{- end -}}'
      # Windows mingw-w64-posix static link: avoid runtime DLL deps on
      # end-user machines (libgcc_s_seh-1.dll, libstdc++-6.dll,
      # libwinpthread-1.dll). `-lwinpthread` (NOT `-lpthread`) is the
      # mingw-w64 native pthread library — winpthread.a is statically
      # linked when combined with `-Wl,-Bstatic`. Order matters: the
      # winpthread reference must come AFTER the duckdb static libs so
      # the linker can resolve `pthread_mutex_*` references inside
      # libparquet_extension.a / libduckdb_static.a. cgo appends
      # CGO_LDFLAGS at the END of the link command, so this works.
      # Empty for non-windows targets.
      - 'CGO_LDFLAGS={{- if and (eq .Os "windows") (eq .Arch "amd64") -}}-static-libgcc -static-libstdc++ -Wl,-Bstatic -lwinpthread -Wl,-Bdynamic{{- end -}}'
    flags:
      - -trimpath
      # WR-07: -buildvcs=false strips runtime/debug VCS metadata
      # (vcs.revision/time/modified) that can drift between two snapshot
      # builds in the same CI run when the working tree gains untracked
      # files (e.g. dist-pass-1/) between Pass-1 and Pass-2. Identity is
      # already pinned via -X main.commit; VCS embedding is redundant.
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: '{{ .CommitTimestamp }}'

  - id: helix-darwin
    main: ./cmd/helix
    binary: helix
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
      - GOFLAGS=-mod=readonly
      # D-15: NO CC override — Apple clang on macos-14 is the host default.
      # Per Wave 0 darwin probe failure (zig cc cannot reach Apple `mach/mach_vm.h`
      # and rewrites duckdb-go-bindings absolute -L paths), darwin moves to a
      # native macos-14 runner. Reproducibility is per-target within-runner
      # Pass-1≡Pass-2 (D-17) — across-runner byte-equality is NOT a gate.
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: helix
    ids: [helix-non-darwin, helix-darwin]
    formats: ["tar.gz"]
    # Note: goreleaser strips the leading 'v' from `{{ .Version }}`, so the literal
    # 'v' below restores the prefix to match the GitHub release tag (v1.9.0). This
    # keeps the INSTALL.md verification recipe (which sets VERSION=v1.9.0) working
    # end-to-end. See REVIEW CR-02.
    name_template: "helix_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Phase 59.1 re-audit (2026-05-06): without this, goreleaser packs the
    # main binary at mode 0644 inside the tar.gz, so users hit
    # `permission denied: ./helix` straight after `tar -xzf …`.
    # The 0755 override forces the binary to ship executable. Verified
    # against v1.10.7 archives (both darwin/arm64 and linux/amd64
    # contained the binary at 0644).
    builds_info:
      mode: 0755
    files:
      - LICENSE*
      - README.md
      - INSTALL.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - id: cosign
    cmd: cosign
    artifacts: all
    signature: "${artifact}.sigstore.json"
    # WR-02: pin --oidc-issuer explicitly so a misconfigured runner that
    # exposes a different OIDC issuer environment variable cannot mint a
    # cert under the wrong issuer (which the verifier would later reject
    # at every user's `helix upgrade` call). Failing at sign-time with
    # "issuer mismatch" is preferable to silent verification breakage.
    #
    # WR-08 (Phase 58 post-rc1): --new-bundle-format is REQUIRED. Without
    # it, cosign sign-blob writes the legacy v1 bundle schema (top-level
    # `base64Signature`/`cert`/`rekorBundle`). cosign verify-blob accepts
    # both schemas, but sigstore-go's strict bundle.Bundle.UnmarshalJSON
    # accepts only the new protobuf bundle format
    # (`mediaType`/`verificationMaterial`/`messageSignature`). Producing
    # legacy bundles breaks every `helix upgrade` call at the verifier
    # boundary (exit: "signature verification FAILED") while still
    # passing the cosign-CLI sanity check -- a class of false-pass that
    # cannot be caught by the existing fixture tests because
    # internal/upgrade/testdata/generate_fixtures.go uses sigstore-go
    # itself, which always emits proto bundles.
    args:
      - "sign-blob"
      - "--new-bundle-format"
      - "--oidc-issuer=https://token.actions.githubusercontent.com"
      # WR-10 (Phase 58 post-rc1.3): use the sigstore PUBLIC-GOOD TSA,
      # not GitHub's internal TSA. internal/upgrade/verify.go pins
      # `verify.WithSignedTimestamps(1)` (>=1 RFC3161 TSA timestamp).
      # The TSA's cert chain MUST appear in
      # internal/upgrade/trusted_root.json. The LIVE sigstore TUF
      # trust root contains exactly one TSA -- `sigstore.dev /
      # sigstore-tsa-selfsigned` -- accessible at
      # https://timestamp.sigstore.dev/api/v1/timestamp. GitHub's
      # https://timestamp.githubapp.com TSA chains to GitHub's
      # internal `Internal Services Root` which is NOT in the
      # public-good TUF (it appeared only in sigstore-go's static
      # `examples/trusted-root-public-good.json`, which had drifted
      # from the live TUF state -- root cause of the rc1.2 verify
      # failure: certificate signed by unknown authority on TSA
      # intermediate). Trust root file refreshed from TUF in lockstep
      # with this change; Makefile target `update-trust-root` now
      # sources from cosign's TUF cache, not the static example file.
      - "--timestamp-server-url=https://timestamp.sigstore.dev/api/v1/timestamp"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Refactor
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999
  filters:
    exclude:
      - '^test:'
      - '^chore:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: agenthands
    name: helix
  prerelease: auto
  draft: false
  mode: replace
  name_template: "Helix {{ .Tag }}"
