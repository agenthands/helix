# Source of truth: goreleaser v2 schema. Generated for Phase 51 (PKG-01).
# Locked decisions: Phase 51 D-03/D-03a (reproducibility), D-04 (INSTALL match),
# D-06 (tag-triggered + auto pre-release), D-07 (auto-generated notes from git log).
# Phase 58 D-02/D-03: cosign keyless signing (replaces the prior signer at v1.10.0; hard cut, no coexistence).
version: 2

project_name: helix

builds:
  - id: helix
    main: ./cmd/helix
    binary: helix
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      # WR-07: -buildvcs=false strips runtime/debug VCS metadata
      # (vcs.revision/time/modified) that can drift between two snapshot
      # builds in the same CI run when the working tree gains untracked
      # files (e.g. dist-pass-1/) between Pass-1 and Pass-2. Identity is
      # already pinned via -X main.commit; VCS embedding is redundant.
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: helix
    ids: [helix]
    formats: ["tar.gz"]
    # Note: goreleaser strips the leading 'v' from `{{ .Version }}`, so the literal
    # 'v' below restores the prefix to match the GitHub release tag (v1.9.0). This
    # keeps the INSTALL.md verification recipe (which sets VERSION=v1.9.0) working
    # end-to-end. See REVIEW CR-02.
    name_template: "helix_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README.md
      - INSTALL.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - id: cosign
    cmd: cosign
    artifacts: all
    signature: "${artifact}.sigstore.json"
    # WR-02: pin --oidc-issuer explicitly so a misconfigured runner that
    # exposes a different OIDC issuer environment variable cannot mint a
    # cert under the wrong issuer (which the verifier would later reject
    # at every user's `helix upgrade` call). Failing at sign-time with
    # "issuer mismatch" is preferable to silent verification breakage.
    #
    # WR-08 (Phase 58 post-rc1): --new-bundle-format is REQUIRED. Without
    # it, cosign sign-blob writes the legacy v1 bundle schema (top-level
    # `base64Signature`/`cert`/`rekorBundle`). cosign verify-blob accepts
    # both schemas, but sigstore-go's strict bundle.Bundle.UnmarshalJSON
    # accepts only the new protobuf bundle format
    # (`mediaType`/`verificationMaterial`/`messageSignature`). Producing
    # legacy bundles breaks every `helix upgrade` call at the verifier
    # boundary (exit: "signature verification FAILED") while still
    # passing the cosign-CLI sanity check -- a class of false-pass that
    # cannot be caught by the existing fixture tests because
    # internal/upgrade/testdata/generate_fixtures.go uses sigstore-go
    # itself, which always emits proto bundles.
    args:
      - "sign-blob"
      - "--new-bundle-format"
      - "--oidc-issuer=https://token.actions.githubusercontent.com"
      # WR-09 (Phase 58 post-rc1.2): include an RFC3161 signed timestamp
      # from GitHub's TSA. internal/upgrade/verify.go pins
      # `verify.WithSignedTimestamps(1)` (require >=1 TSA-signed
      # timestamp) for defense-in-depth alongside Rekor's integrated
      # SET. cosign keyless DOES NOT request a TSA timestamp by default
      # -- only the Rekor entry's SET (which the verifier already
      # accepts via WithIntegratedTimestamps(1)). Without this flag,
      # every CI-produced bundle fails the verifier with
      # "threshold not met for verified signed timestamps: 0 < 1".
      # The TSA URL must match a TSA whose cert chain is in
      # internal/upgrade/trusted_root.json -- the public-good trust
      # root only ships GitHub's `Internal Services Root` TSA, hence
      # this URL specifically. The unit-test fixtures
      # (testdata/generate_fixtures.go) include TSA timestamps via
      # sigstore-go's VirtualSigstore CA, which is why the failure
      # only surfaces on real CI bundles -- the same false-pass class
      # as WR-08 and a hard reminder to add a CI self-test step that
      # runs the just-built helix verifier against the just-produced
      # bundle BEFORE the release upload.
      - "--timestamp-server-url=https://timestamp.githubapp.com/api/v1/timestamp"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Refactor
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999
  filters:
    exclude:
      - '^test:'
      - '^chore:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: agenthands
    name: helix
  prerelease: auto
  draft: false
  mode: replace
  name_template: "Helix {{ .Tag }}"
