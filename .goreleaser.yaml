# Source of truth: goreleaser v2 schema. Generated for Phase 51 (PKG-01).
# Locked decisions: Phase 51 D-03/D-03a (reproducibility), D-04 (INSTALL match),
# D-06 (tag-triggered + auto pre-release), D-07 (auto-generated notes from git log).
# Phase 58 D-02/D-03: cosign keyless signing (replaces the prior signer at v1.10.0; hard cut, no coexistence).
version: 2

project_name: helix

builds:
  - id: helix
    main: ./cmd/helix
    binary: helix
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      # WR-07: -buildvcs=false strips runtime/debug VCS metadata
      # (vcs.revision/time/modified) that can drift between two snapshot
      # builds in the same CI run when the working tree gains untracked
      # files (e.g. dist-pass-1/) between Pass-1 and Pass-2. Identity is
      # already pinned via -X main.commit; VCS embedding is redundant.
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: helix
    ids: [helix]
    formats: ["tar.gz"]
    # Note: goreleaser strips the leading 'v' from `{{ .Version }}`, so the literal
    # 'v' below restores the prefix to match the GitHub release tag (v1.9.0). This
    # keeps the INSTALL.md verification recipe (which sets VERSION=v1.9.0) working
    # end-to-end. See REVIEW CR-02.
    name_template: "helix_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README.md
      - INSTALL.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - id: cosign
    cmd: cosign
    artifacts: all
    signature: "${artifact}.sigstore.json"
    # WR-02: pin --oidc-issuer explicitly so a misconfigured runner that
    # exposes a different OIDC issuer environment variable cannot mint a
    # cert under the wrong issuer (which the verifier would later reject
    # at every user's `helix upgrade` call). Failing at sign-time with
    # "issuer mismatch" is preferable to silent verification breakage.
    args:
      - "sign-blob"
      - "--oidc-issuer=https://token.actions.githubusercontent.com"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Refactor
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999
  filters:
    exclude:
      - '^test:'
      - '^chore:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: agenthands
    name: helix
  prerelease: auto
  draft: false
  mode: replace
  name_template: "Helix {{ .Tag }}"
