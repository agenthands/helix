# Source of truth: goreleaser v2 schema. Generated for Phase 51 (PKG-01).
# Locked decisions: Phase 51 D-03/D-03a (reproducibility), D-04 (INSTALL match),
# D-06 (tag-triggered + auto pre-release), D-07 (auto-generated notes from git log).
# Phase 58 D-02/D-03: cosign keyless signing (replaces the prior signer at v1.10.0; hard cut, no coexistence).
version: 2

project_name: helix

# Phase 59.1 D-15 split-runner pipeline implemented via the goreleaser OSS
# multi-build-entry pattern (Fallback B per
# .planning/phases/.../59.1-02-SPLIT-PROBE-NOTES.md — split/merge is
# GoReleaser Pro only at v2.15.4 and Helix is on OSS). Each runner invokes
# `goreleaser build --id <runner-id> --snapshot --clean`; the merge job runs
# `goreleaser release --skip=build` to assemble archives + checksums +
# signatures from the pre-built binaries uploaded by both runners.
builds:
  - id: helix-non-darwin
    main: ./cmd/helix
    binary: helix
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
      - GOFLAGS=-mod=readonly
      # D-01 amended: zig cc covers linux+windows ONLY (4 archives on the
      # ubuntu-22.04 runner). Templated per-target CC via Go-template
      # conditionals on .Os and .Arch (Pattern A4). darwin entries live in
      # the helix-darwin build entry below and get NO CC override — Apple
      # clang on macos-14 is the host default per D-15.
      - >-
        {{- if eq .Os "linux" }}
          {{- if eq .Arch "amd64" }}CC=zig cc -target x86_64-linux-gnu{{- end }}
          {{- if eq .Arch "arm64" }}CC=zig cc -target aarch64-linux-gnu{{- end }}
        {{- else if eq .Os "windows" }}
          {{- if eq .Arch "amd64" }}CC=zig cc -target x86_64-windows-gnu{{- end }}
          {{- if eq .Arch "arm64" }}CC=zig cc -target aarch64-windows-gnu{{- end }}
        {{- end }}
    flags:
      - -trimpath
      # WR-07: -buildvcs=false strips runtime/debug VCS metadata
      # (vcs.revision/time/modified) that can drift between two snapshot
      # builds in the same CI run when the working tree gains untracked
      # files (e.g. dist-pass-1/) between Pass-1 and Pass-2. Identity is
      # already pinned via -X main.commit; VCS embedding is redundant.
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: '{{ .CommitTimestamp }}'

  - id: helix-darwin
    main: ./cmd/helix
    binary: helix
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
      - GOFLAGS=-mod=readonly
      # D-15: NO CC override — Apple clang on macos-14 is the host default.
      # Per Wave 0 darwin probe failure (zig cc cannot reach Apple `mach/mach_vm.h`
      # and rewrites duckdb-go-bindings absolute -L paths), darwin moves to a
      # native macos-14 runner. Reproducibility is per-target within-runner
      # Pass-1≡Pass-2 (D-17) — across-runner byte-equality is NOT a gate.
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: helix
    ids: [helix-non-darwin, helix-darwin]
    formats: ["tar.gz"]
    # Note: goreleaser strips the leading 'v' from `{{ .Version }}`, so the literal
    # 'v' below restores the prefix to match the GitHub release tag (v1.9.0). This
    # keeps the INSTALL.md verification recipe (which sets VERSION=v1.9.0) working
    # end-to-end. See REVIEW CR-02.
    name_template: "helix_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README.md
      - INSTALL.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - id: cosign
    cmd: cosign
    artifacts: all
    signature: "${artifact}.sigstore.json"
    # WR-02: pin --oidc-issuer explicitly so a misconfigured runner that
    # exposes a different OIDC issuer environment variable cannot mint a
    # cert under the wrong issuer (which the verifier would later reject
    # at every user's `helix upgrade` call). Failing at sign-time with
    # "issuer mismatch" is preferable to silent verification breakage.
    #
    # WR-08 (Phase 58 post-rc1): --new-bundle-format is REQUIRED. Without
    # it, cosign sign-blob writes the legacy v1 bundle schema (top-level
    # `base64Signature`/`cert`/`rekorBundle`). cosign verify-blob accepts
    # both schemas, but sigstore-go's strict bundle.Bundle.UnmarshalJSON
    # accepts only the new protobuf bundle format
    # (`mediaType`/`verificationMaterial`/`messageSignature`). Producing
    # legacy bundles breaks every `helix upgrade` call at the verifier
    # boundary (exit: "signature verification FAILED") while still
    # passing the cosign-CLI sanity check -- a class of false-pass that
    # cannot be caught by the existing fixture tests because
    # internal/upgrade/testdata/generate_fixtures.go uses sigstore-go
    # itself, which always emits proto bundles.
    args:
      - "sign-blob"
      - "--new-bundle-format"
      - "--oidc-issuer=https://token.actions.githubusercontent.com"
      # WR-10 (Phase 58 post-rc1.3): use the sigstore PUBLIC-GOOD TSA,
      # not GitHub's internal TSA. internal/upgrade/verify.go pins
      # `verify.WithSignedTimestamps(1)` (>=1 RFC3161 TSA timestamp).
      # The TSA's cert chain MUST appear in
      # internal/upgrade/trusted_root.json. The LIVE sigstore TUF
      # trust root contains exactly one TSA -- `sigstore.dev /
      # sigstore-tsa-selfsigned` -- accessible at
      # https://timestamp.sigstore.dev/api/v1/timestamp. GitHub's
      # https://timestamp.githubapp.com TSA chains to GitHub's
      # internal `Internal Services Root` which is NOT in the
      # public-good TUF (it appeared only in sigstore-go's static
      # `examples/trusted-root-public-good.json`, which had drifted
      # from the live TUF state -- root cause of the rc1.2 verify
      # failure: certificate signed by unknown authority on TSA
      # intermediate). Trust root file refreshed from TUF in lockstep
      # with this change; Makefile target `update-trust-root` now
      # sources from cosign's TUF cache, not the static example file.
      - "--timestamp-server-url=https://timestamp.sigstore.dev/api/v1/timestamp"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Refactor
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999
  filters:
    exclude:
      - '^test:'
      - '^chore:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: agenthands
    name: helix
  prerelease: auto
  draft: false
  mode: replace
  name_template: "Helix {{ .Tag }}"
