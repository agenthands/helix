steps:
  - tool: find_references
    args:
      symbol: handleRequest
  - tool: replace_symbol_body
    args:
      symbol: handleRequest
      body: |
        func handleRequest(name string) error {
        	cmd := exec.Command("echo", name)
        	out, err := cmd.Output()
        	if err != nil {
        		return fmt.Errorf("handleRequest: %w", err)
        	}
        	fmt.Printf("result: %s", out)
        	return nil
        }
