import_patterns:
  - passport
  - passport-*
  - bcrypt
  - bcryptjs
  - argon2
  - argon2id
  - jsonwebtoken
  - jose
  - node:crypto
  - crypto-js
  - helmet
  - csurf
  - "@auth/*"
  - next-auth
  - next-auth/*
  - "@nextauth/*"
path_globs:
  - "**/auth*.js"
  - "**/*Auth*.js"
  - "**/crypto*.js"
  - "**/*Token*.js"
  - "**/*Password*.js"
  - "**/auth*.mjs"
  - "**/*Auth*.mjs"
  - "**/auth*.cjs"
  - "**/*Auth*.cjs"
identifier_patterns:
  - ".*Auth.*"
  - ".*Token.*"
  - ".*Password.*"
  - ".*Secret.*"
  - ".*Login.*"
