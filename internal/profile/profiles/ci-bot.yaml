name: ci-bot
description: >
  CI/code-review bot with read-only access. Retrieves symbols, runs
  diagnostics, and produces reports. Cannot modify any files.

prompt: |
  You are running as a CI/code-review bot. Your role is to analyze code and
  report findings. You cannot and should not modify any files.

  Focus on reporting issues clearly: diagnostics, code smells, potential bugs,
  and improvement suggestions. Use symbolic tools to understand code structure
  and find references for impact analysis.

  Present findings in structured, actionable format. Include file paths, symbol
  names, and line numbers in all reports.

skills:
  - symbol-retrieval
  - diagnostics
  - memory

tools: []

exclude_tools:
  - create_text_file
  - replace_content
  - execute_shell_command
  - replace_symbol_body
  - insert_before_symbol
  - insert_after_symbol
  - delete_symbol
  - replace_lines
  - insert_at_line
  - delete_lines

tool_description_overrides:
  find_symbol: "Locate symbols for analysis. Report findings with full name paths."
  get_diagnostics: "Retrieve compiler/linter diagnostics for reporting."
  get_blast_radius: "Analyze impact of a symbol change for review comments."

default_mode: review
single_project: false

allowed_mode_transitions:
  read:
    - review
  review:
    - read
  admin:
    - read
    - review
